apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: isl-recognition-api
  namespace: isl-recognition
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: isl-recognition-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70