name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile source files
        run: python -m compileall app tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript
        run: node --check frontend/app.js

      - name: Check frontend assets
        shell: bash
        run: test -s frontend/index.html && test -s frontend/styles.css && test -s frontend/config.js && test -s frontend/classes.json && test -s frontend/action-mapping.json

       - name: Validate production hand model contract
        run: >-
          python -c "import json, numpy as np, tensorflow as tf; from pathlib import Path; p=Path('models/include50_hand_lstm_savedmodel'); sm=tf.saved_model.load(str(p)); sig=sm.signatures.get('serve') or sm.signatures.get('serving_default'); assert sig is not None; inp=next(iter(sig.structured_input_signature[1].values())); out=next(iter(sig.structured_outputs.values())); assert tuple(inp.shape[1:]) == (45,126), inp.shape; assert out.shape[-1] == 50, out.shape; data=json.loads(Path('models/include50_hand_classes.json').read_text(encoding='utf-8')); assert len(data)==50 and all(str(i) in data for i in range(50)); x=np.zeros((1,45,126),dtype=np.float32); name=next(iter(sig.structured_input_signature[1])); y=np.asarray(next(iter(sig(**{name:tf.convert_to_tensor(x)}).values()))); assert y.shape==(1,50); assert np.isfinite(y).all(); assert np.allclose(y.sum(axis=1),1.0,atol=1e-5); print('hand-model-contract-ok')"

      - name: Build Docker image
        run: docker build -t isl-recognition:test .

      - name: Build frontend image
        run: docker build -t isl-recognition-frontend:test frontend