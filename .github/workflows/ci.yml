name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile production source
        run: |
          python -m compileall app tests

      - name: Run production tests
        run: |
          python -m pytest -q \
            tests/test_api.py \
            tests/test_dataset_validation.py \
            tests/test_model_integrity.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check frontend JavaScript
        run: node --check frontend/app.js

      - name: Check frontend assets
        shell: bash
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/config.js
          test -s frontend/classes.json
          test -s frontend/action-mapping.json

      - name: Validate production hand model
        run: |
          python -c "
          import json
          import numpy as np
          import tensorflow as tf
          from pathlib import Path

          model_path = Path('models/include50_hand_lstm_savedmodel')
          class_path = Path('models/include50_hand_classes.json')

          assert model_path.is_dir(), f'Missing model: {model_path}'
          assert class_path.is_file(), f'Missing class map: {class_path}'

          model = tf.saved_model.load(str(model_path))

          signature = (
              model.signatures.get('serve')
              or model.signatures.get('serving_default')
          )

          assert signature is not None, 'No serving signature found'

          inputs = signature.structured_input_signature[1]
          outputs = signature.structured_outputs

          input_spec = next(iter(inputs.values()))
          output_spec = next(iter(outputs.values()))

          assert tuple(input_spec.shape[1:]) == (45, 126), input_spec.shape
          assert output_spec.shape[-1] == 50, output_spec.shape

          class_map = json.loads(
              class_path.read_text(encoding='utf-8')
          )

          assert len(class_map) == 50
          assert all(str(i) in class_map for i in range(50))

          input_name = next(iter(inputs))

          x = np.zeros(
              (1, 45, 126),
              dtype=np.float32
          )

          result = signature(
              **{
                  input_name: tf.convert_to_tensor(x)
              }
          )

          y = np.asarray(next(iter(result.values())))

          assert y.shape == (1, 50)
          assert np.isfinite(y).all()
          assert np.allclose(
              y.sum(axis=1),
              1.0,
              atol=1e-5
          )

          print('PRODUCTION HAND MODEL: OK')
          print('Input:', input_spec.shape)
          print('Output:', output_spec.shape)
          print('Classes:', len(class_map))
          "

      - name: Build backend Docker image
        run: docker build -t isl-recognition:test .

      - name: Build frontend Docker image
        run: docker build -t isl-recognition-frontend:test frontend
