name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: isl-recognition
  FRONTEND_IMAGE_NAME: isl-recognition-frontend
  REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        if: env.REGISTRY_LOGIN_SERVER != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Log in to container registry
        if: env.REGISTRY_LOGIN_SERVER != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: env.REGISTRY_LOGIN_SERVER != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push frontend image
        if: env.REGISTRY_LOGIN_SERVER != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Set up kubectl
        if: env.KUBE_CONFIG_DATA != '' && env.REGISTRY_LOGIN_SERVER != ''
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes context
        if: env.KUBE_CONFIG_DATA != '' && env.REGISTRY_LOGIN_SERVER != ''
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ env.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl --kubeconfig "$HOME/.kube/config" config current-context

      - name: Deploy to Kubernetes
        if: env.KUBE_CONFIG_DATA != '' && env.REGISTRY_LOGIN_SERVER != ''
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/namespace.yaml
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/configmap.yaml
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/service.yaml
          sed -i "s|^          image:.*|          image: $IMAGE_REF|" k8s/deployment.yaml
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/deployment.yaml
          sed -i "s|^          image:.*|          image: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}|" k8s/frontend-deployment.yaml
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/frontend-deployment.yaml
          kubectl --kubeconfig "$HOME/.kube/config" apply -f k8s/ingress.yaml
          kubectl --kubeconfig "$HOME/.kube/config" -n isl-recognition rollout status deployment/isl-recognition-api --timeout=180s
          kubectl --kubeconfig "$HOME/.kube/config" -n isl-recognition rollout status deployment/isl-recognition-frontend --timeout=180s